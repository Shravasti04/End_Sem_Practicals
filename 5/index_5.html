<!DOCTYPE html>
<html>

<head>
  <title>Student Records</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>

<body>

  <h2>Student Marks</h2>

  <input id="name" placeholder="Student Name">
  <input id="roll" placeholder="Roll No">

  <br><br>

  <input id="m1" type="number" placeholder="Subject 1">
  <input id="m2" type="number" placeholder="Subject 2">
  <input id="m3" type="number" placeholder="Subject 3">

  <br><br>

  <button onclick="addStudent()">Add Student</button>

  <table>
    <tr>
      <th>Name</th>
      <th>Roll No</th>
      <th>Total</th>
      <th>Percentage</th>
    </tr>
    <tbody id="records"></tbody>
  </table>

  <h3 id="topper">Topper: None</h3>

  <script>
    let max = -1;
    let topName = "";

    function addStudent() {
      let name = document.getElementById("name").value;
      let roll = document.getElementById("roll").value;
      let a = Number(document.getElementById("m1").value);
      let b = Number(document.getElementById("m2").value);
      let c = Number(document.getElementById("m3").value);

      if (name == "" || roll == "" ||
        document.getElementById("m1").value == "" ||
        document.getElementById("m2").value == "" ||
        document.getElementById("m3").value == "" ||
        a < 0 || b < 0 || c < 0 ||
        a > 100 || b > 100 || c > 100) {
        alert("Enter valid details and marks (0-100)");
        return;
      }

      let total = a + b + c;
      let per = total / 3;

      let row = document.getElementById("records").insertRow();

      row.insertCell(0).innerHTML = name;
      row.insertCell(1).innerHTML = roll;
      row.insertCell(2).innerHTML = total;
      row.insertCell(3).innerHTML = per.toFixed(2) + "%";

      if (total > max) {
        max = total;
        topName = name;
        document.getElementById("topper").innerHTML =
          "Topper: " + topName + " (" + max + " marks)";
      }

      document.getElementById("name").value = "";
      document.getElementById("roll").value = "";
      document.getElementById("m1").value = "";
      document.getElementById("m2").value = "";
      document.getElementById("m3").value = "";
    }
  </script>

</body>

</html>
