<!DOCTYPE html>
<html>

<head>
  <title>Student Page</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background-color: lightgray;
    }

    nav {
      background-color: navy;
      padding: 15px;
    }

    nav a {
      color: white;
      margin: 15px;
      text-decoration: none;
    }

    h2 {
      text-align: center;
    }

    img {
      width: 150px;
    }

    table {
      width: 80%;
      margin: auto;
      border-collapse: collapse;
      background-color: white;
    }

    th,
    td {
      border: 1px solid black;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: lightblue;
    }
  </style>
</head>

<body>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

  <h2>Student Information</h2>

  <center>
    <img src="https://via.placeholder.com/150" alt="Student Image">
  </center>

  <table>
    <tr>
      <th>Roll No</th>
      <th>Name</th>
      <th>Course</th>
    </tr>
    <tr>
      <td>1</td>
      <td>Amit</td>
      <td>IT</td>
    </tr>
    <tr>
      <td>2</td>
      <td>Priya</td>
      <td>Computer</td>
    </tr>
  </table>
</body>

</html>
